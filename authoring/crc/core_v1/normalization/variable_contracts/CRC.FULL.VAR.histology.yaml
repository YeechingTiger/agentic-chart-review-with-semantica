contract_id: CRC.FULL.VAR.histology
contract_version: 0.1.0
authoring_status: candidate
clinical_use: NOT_FOR_CLINICAL_USE
canonical_variable_id: crc.histology
label: Histology ICD-O-3
roles:
- action
datatype: string
value_domain: CRC.CANDIDATE.disease_context#histology_icdo3
temporal_meaning: tumor_record_identity
mapping_level: registry_direct
registry_mapping:
  standard: NAACCR_v26
  item_name: Histologic Type ICD-O-3
  item_number: '522'
  xml_id: histologicTypeIcdO3
  effective_years: all
question: What is the Histology ICD-O-3 for the indexed CRC tumor, test, treatment, or decision at tumor_record_identity?
applicability_guard:
  disease: colorectal_cancer
  rule_uses:
  - E26-MOL-001
field_contract:
  name: histology
  type: string
  nullable: true
  value_domain: CRC.CANDIDATE.disease_context#histology_icdo3
  description: Histology ICD-O-3
evidence_contract:
  establishing_source_documents: &id001
  - final_pathology
  - pathology_addendum
  - registry
  excluded_sources: &id002
  - imaging_only
  positive_witness: A tumor- and time-linked source owned by the relevant clinical discipline explicitly establishes crc.histology.
  negative_or_unknown_proof:
    mode: candidate_review_required
    required_coverage:
    - Review every available establishing document class in the indexed rule window.
    statement: Unspecified carcinoma codes are positive specificity claims, not defaults.
  conflict_policy: Retain conflicting citations; prefer the indexed primary source and timepoint. Abstain when source precedence
    does not resolve the conflict.
proof_obligation:
  for_positive: At least one tumor- and time-linked establishing source explicitly supports crc.histology; copied or unanchored
    mentions are insufficient.
  for_negative_or_unknown:
    mode: candidate_review_required
    required_document_classes: *id001
    excluded_document_classes: *id002
    runtime_enforcement: not_materialized
missingness_semantics: Unspecified carcinoma codes are positive specificity claims, not defaults.
abstention:
  EVIDENCE_INSUFFICIENT: The available indexed evidence does not establish the variable.
  SPEC_INSUFFICIENT: The candidate contract does not cover this evidence pattern or timepoint.
boundary_cases:
- case_id: wrong_tumor_or_timepoint
  input: Histology ICD-O-3 is documented only for another tumor, specimen, line, or later decision.
  expected: Do not back-project; return EVIDENCE_INSUFFICIENT for the indexed use.
- case_id: conflicting_establishing_sources
  input: Two admissible indexed sources disagree and precedence does not resolve them.
  expected: Retain both citations and abstain EVIDENCE_INSUFFICIENT.
- case_id: mention_without_establishing_source
  input: Only a copied problem-list or unanchored summary mention is available.
  expected: Do not emit a positive value.
- case_id: registry_projection_is_coarser
  input: A registry value exists but omits a distinction required by this variable.
  expected: Keep the registry value as a validation projection only; do not infer the detailed canonical value.
execution_binding:
  execution_group_id: crc_molecular_results
  output_field: histology
  runtime_status: planned_not_materialized
source_concepts:
- histology
conformance:
  verdict: needs_revision
  issues:
  - A candidate contract exists, but the current production owner in specs/ fails provenance enforcement and promotion/collision
    resolution is pending.
review_requirements:
- clinical_domain_reviewer
- registrar
- engineer
