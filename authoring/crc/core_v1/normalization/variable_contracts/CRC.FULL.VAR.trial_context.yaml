contract_schema_version: '2.0'
contract_id: CRC.FULL.VAR.trial_context
contract_version: 0.1.0
authoring_status: candidate
clinical_use: NOT_FOR_CLINICAL_USE
canonical_variable_id: crc.trial_context
label: Molecular testing trial context
roles:
- exceptions
datatype: categorical
value_domain: CRC.CHART.molecular_detail#trial_context
temporal_meaning: at_indexed_test_and_treatment_decision
mapping_level: chart_extension
registry_mapping:
  standard: none
  item_name: none
  item_number: none
  xml_id: none
  effective_years: none
question: What is the Molecular testing trial context for the indexed CRC tumor, test, treatment, or decision at at_indexed_test_and_treatment_decision?
applicability_guard:
  disease: colorectal_cancer
  rule_uses:
  - CAP17-BIO-06
  - CAP17-BIO-07
  - E26-LOCAL-18
  - SITC23-CRC-04
field_contract:
  name: trial_context
  type: categorical
  nullable: true
  value_domain: CRC.CHART.molecular_detail#trial_context
  description: Molecular testing trial context
evidence_contract:
  establishing_source_documents: &id001
  - trial_consent
  - protocol_note
  - oncology
  excluded_sources: &id002
  - research_assay_without_trial_link
  positive_witness: A tumor- and time-linked source owned by the relevant clinical discipline explicitly establishes crc.trial_context.
  negative_or_unknown_proof:
    mode: candidate_review_required
    required_coverage:
    - Review every available establishing document class in the indexed rule window.
    statement: Not documented and routine care remain distinct.
  conflict_policy: Retain conflicting citations; prefer the indexed primary source and timepoint. Abstain when source precedence
    does not resolve the conflict.
proof_obligation:
  for_positive: At least one tumor- and time-linked establishing source explicitly supports crc.trial_context; copied or unanchored
    mentions are insufficient.
  for_negative_or_unknown:
    mode: candidate_review_required
    required_document_classes: *id001
    excluded_document_classes: *id002
    runtime_enforcement: not_materialized
missingness_semantics: Not documented and routine care remain distinct.
abstention:
  EVIDENCE_INSUFFICIENT: The available indexed evidence does not establish the variable.
  SPEC_INSUFFICIENT: The candidate contract does not cover this evidence pattern or timepoint.
boundary_cases:
- case_id: wrong_tumor_or_timepoint
  input: Molecular testing trial context is documented only for another tumor, specimen, line, or later decision.
  expected: Do not back-project; return EVIDENCE_INSUFFICIENT for the indexed use.
- case_id: conflicting_establishing_sources
  input: Two admissible indexed sources disagree and precedence does not resolve them.
  expected: Retain both citations and abstain EVIDENCE_INSUFFICIENT.
- case_id: mention_without_establishing_source
  input: Only a copied problem-list or unanchored summary mention is available.
  expected: Do not emit a positive value.
- case_id: registry_projection_is_coarser
  input: A registry value exists but omits a distinction required by this variable.
  expected: Keep the registry value as a validation projection only; do not infer the detailed canonical value.
execution_binding:
  execution_group_id: CRC.FULL.chart_misc
  output_field: trial_context
  runtime_status: planned_not_materialized
source_concepts:
- trial
conformance:
  verdict: needs_revision
  issues:
  - The candidate is structurally specified but contains unmeasured model-authored domains or source precedence requiring
    specialist review.
review_requirements:
- clinical_domain_reviewer
- registrar
- engineer
