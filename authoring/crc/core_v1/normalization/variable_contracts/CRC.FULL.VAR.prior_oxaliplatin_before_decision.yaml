value_domain: &id001
  kind: explicit_contract_required
  required_missing_states:
  - not_assessed
  - indeterminate
  - not_documented
temporal_meaning: Must be known on or before the indexed decision. Later evidence must not be back-projected. Variables describing
  delivery additionally retain the actual event date.
mapping_level: chart_extension
registry_mapping:
  standard: none
  status: no_verified_mapping
question: What is the prior oxaliplatin before decision for the indexed CRC tumor, test, treatment, or decision at Must be
  known on or before the indexed decision. Later evidence must not be back-projected. Variables describing delivery additionally
  retain the actual event date.?
