contract_schema_version: '2.0'
contract_id: CRC.FULL.VAR.laboratory_alternative_quality_assurance
contract_version: 0.1.0
authoring_status: candidate
clinical_use: NOT_FOR_CLINICAL_USE
canonical_variable_id: crc.laboratory_alternative_quality_assurance
label: Laboratory Alternative Quality Assurance
roles:
- action
datatype: string
value_domain: &id001
  kind: open_coded_or_text
  normalization_required: true
temporal_meaning: Version or service-period specific external context; not a timeless patient-chart fact.
mapping_level: outside_current_sources
registry_mapping:
  standard: none
  status: not_verified_in_module_normalization
question: What is the Laboratory Alternative Quality Assurance for the indexed CRC tumor, test, treatment, or decision at
  Version or service-period specific external context; not a timeless patient-chart fact.?
applicability_guard:
  disease: colorectal_cancer
  rule_uses:
  - CAP17-BIO-22
field_contract:
  name: laboratory_alternative_quality_assurance
  type: string
  nullable: true
  value_domain: *id001
  description: Laboratory Alternative Quality Assurance
evidence_contract:
  establishing_source_documents: &id002
  - laboratory_information_system
  - quality_management_system
  - versioned_policy_or_regulatory_source
  excluded_sources: &id003
  - patient_note_without_external_version_binding
  - registry_summary
  positive_witness: A tumor- and time-linked source owned by the relevant clinical discipline explicitly establishes crc.laboratory_alternative_quality_assurance.
  negative_or_unknown_proof:
    mode: candidate_review_required
    required_coverage:
    - Review every available establishing document class in the indexed rule window.
    statement: &id004
    - not_performed
    - result_unavailable
    - indeterminate_or_equivocal
    - not_documented_or_not_assessed
    - not_applicable
  conflict_policy: Retain conflicting citations; prefer the indexed primary source and timepoint. Abstain when source precedence
    does not resolve the conflict.
proof_obligation:
  for_positive: At least one tumor- and time-linked establishing source explicitly supports crc.laboratory_alternative_quality_assurance;
    copied or unanchored mentions are insufficient.
  for_negative_or_unknown:
    mode: candidate_review_required
    required_document_classes: *id002
    excluded_document_classes: *id003
    runtime_enforcement: not_materialized
missingness_semantics: *id004
abstention:
  EVIDENCE_INSUFFICIENT: The available indexed evidence does not establish the variable.
  SPEC_INSUFFICIENT: The candidate contract does not cover this evidence pattern or timepoint.
boundary_cases:
- case_id: wrong_tumor_or_timepoint
  input: Laboratory Alternative Quality Assurance is documented only for another tumor, specimen, line, or later decision.
  expected: Do not back-project; return EVIDENCE_INSUFFICIENT for the indexed use.
- case_id: conflicting_establishing_sources
  input: Two admissible indexed sources disagree and precedence does not resolve them.
  expected: Retain both citations and abstain EVIDENCE_INSUFFICIENT.
- case_id: mention_without_establishing_source
  input: Only a copied problem-list or unanchored summary mention is available.
  expected: Do not emit a positive value.
- case_id: registry_projection_is_coarser
  input: A registry value exists but omits a distinction required by this variable.
  expected: Keep the registry value as a validation projection only; do not infer the detailed canonical value.
execution_binding:
  execution_group_id: crc_external_and_service_context
  output_field: laboratory_alternative_quality_assurance
  runtime_status: planned_not_materialized
source_concepts: []
conformance:
  verdict: needs_revision
  issues:
  - full-universe generated contract requires clinical and evidence-owner review
review_requirements:
- clinical_domain_reviewer
- registrar
- engineer
