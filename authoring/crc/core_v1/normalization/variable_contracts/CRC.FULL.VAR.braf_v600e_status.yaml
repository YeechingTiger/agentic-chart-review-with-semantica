  - E26-SYS-3L-26
  - EC20-LYNCH-MLH1-01
field_contract:
  name: braf_v600e_status
  type: categorical
  nullable: true
  value_domain: CRC.STORE.molecular_summary#braf_registry_code
  description: BRAF V600E status
evidence_contract:
  establishing_source_documents: &id001
  - molecular_report
  - pathology_addendum
  - registry
  excluded_sources: &id002
  - BRAF_mutated_without_variant_for_V600E_claim
  positive_witness: A tumor- and time-linked source owned by the relevant clinical discipline explicitly establishes crc.braf_v600e_status.
  negative_or_unknown_proof:
    mode: candidate_review_required
    required_coverage:
    - Review every available establishing document class in the indexed rule window.
    statement: Code 1 is V600E; other mutation/ordered/not applicable/not documented remain distinct.
  conflict_policy: Retain conflicting citations; prefer the indexed primary source and timepoint. Abstain when source precedence
    does not resolve the conflict.
proof_obligation:
  for_positive: At least one tumor- and time-linked establishing source explicitly supports crc.braf_v600e_status; copied
    or unanchored mentions are insufficient.
  for_negative_or_unknown:
    mode: candidate_review_required
    required_document_classes: *id001
    excluded_document_classes: *id002
    runtime_enforcement: not_materialized
missingness_semantics: Code 1 is V600E; other mutation/ordered/not applicable/not documented remain distinct.
abstention:
  EVIDENCE_INSUFFICIENT: The available indexed evidence does not establish the variable.
  SPEC_INSUFFICIENT: The candidate contract does not cover this evidence pattern or timepoint.
boundary_cases:
- case_id: wrong_tumor_or_timepoint
  input: BRAF V600E status is documented only for another tumor, specimen, line, or later decision.
  expected: Do not back-project; return EVIDENCE_INSUFFICIENT for the indexed use.
- case_id: conflicting_establishing_sources
  input: Two admissible indexed sources disagree and precedence does not resolve them.
  expected: Retain both citations and abstain EVIDENCE_INSUFFICIENT.
- case_id: mention_without_establishing_source
  input: Only a copied problem-list or unanchored summary mention is available.
  expected: Do not emit a positive value.
- case_id: registry_projection_is_coarser
  input: A registry value exists but omits a distinction required by this variable.
  expected: Keep the registry value as a validation projection only; do not infer the detailed canonical value.
execution_binding:
  execution_group_id: CRC.FULL.chart_misc
  output_field: braf_v600e_status
  runtime_status: planned_not_materialized
source_concepts:
- braf
- braf_status
- braf_v600e
conformance:
  verdict: needs_revision
  issues:
  - The candidate contract loads natively, but runtime proves keyword searches rather than the required molecular-report/pathology-addendum
    document coverage.
  - Add a document-category coverage operator before codes 8 or 9 can satisfy the declared proof obligation.
review_requirements:
- clinical_domain_reviewer
- registrar
- engineer
