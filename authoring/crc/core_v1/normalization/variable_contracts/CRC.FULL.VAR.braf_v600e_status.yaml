  item_name: BRAF Mutational Analysis
  item_number: '3940'
  xml_id: brafMutationalAnalysis
  effective_years: 2021+
question: What is the BRAF V600E status for the indexed CRC tumor, test, treatment, or decision at tumor_molecular_characterization?
