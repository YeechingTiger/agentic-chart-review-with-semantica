  source_anchor: Local treatment recommendation 1
  category: oligometastatic_local
  title: MDT for oligometastatic disease
  core_or_supplemental: core
  source_context:
    eligibility: Oligometastatic disease
    action: Review in MDT
    timing: Before treatment
    exceptions: None
    predicate_logic: OMD => MDT
  requirements:
    eligibility:
      expression: Oligometastatic disease
      variables:
      - crc.metastatic_lesion_count_at_decision
      - crc.metastatic_sites_at_decision
      - crc.metastatic_status
      - crc.primary_site
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.metastatic_sites_at_decision
        - variable: crc.metastatic_lesion_count_at_decision
        - variable: crc.primary_site
        - variable: crc.metastatic_status
    action:
      expression: Review in MDT
      variables:
      - crc.local_treatment_at_decision
      - crc.mdt_recommendation
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.mdt_recommendation
        - variable: crc.local_treatment_at_decision
    timing:
      expression: Before treatment
      variables:
      - crc.decision_date
      - crc.local_treatment_date
      - crc.mdt_review_date
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.mdt_review_date
        - variable: crc.decision_date
        - variable: crc.local_treatment_date
    exceptions:
      expression: None
      variables: []
