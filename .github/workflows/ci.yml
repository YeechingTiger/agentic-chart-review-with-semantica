name: ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install the maintained chart-review surface
        run: |
          uv venv --python 3.12
          uv pip install -e ".[ledger,dev,notebook]"
          uv pip install --no-deps semantica==0.6.6

      - name: Verify the lockfile
        run: uv lock --check

      - name: Lint
        run: .venv/bin/ruff check src tests tools

      - name: Test the MVP
        run: .venv/bin/python -m pytest tests/test_mvp_*.py -q

      - name: Validate the maintained notebooks
        run: |
          for notebook in notebooks/0*.ipynb; do
            .venv/bin/python -m json.tool "$notebook" >/dev/null
          done
