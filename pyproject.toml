[project]
name = "agentic-chart-review-with-semantica"
version = "0.1.0"
description = "Auditable chart review with the Codex harness, Langtrace, and Semantica decision intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Xing He" }]
keywords = ["ehr", "chart-review", "decision-intelligence", "langtrace", "semantica"]

dependencies = [
    "litellm>=1.55",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "requests>=2.32,<3",
    "opentelemetry-api>=1.27,<2",
    # The MVP harness is the open-source Codex App Server API.  The Python SDK's stable
    # release currently trails the runtime; runner.py deliberately points it at the separately
    # pinned codex-cli 0.150.1 instead of using the SDK's bundled 0.147 runtime.
    "openai-codex==0.147.0",
    # Langtrace is the trace store and the read source for decision reconstruction.
    "langtrace-python-sdk==3.8.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]
notebook = [
    "jupyterlab>=4.2,<5",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "ipykernel>=6.29,<7",
]
# THE JUDGMENT LEDGER. semantica itself is deliberately NOT listed here, because it cannot be
# installed from this file: it declares 124 dependencies — torch, spacy, transformers, opencv,
# faiss, librosa — for features we switch off at graph construction (no embeddings or automatic
# entity/relationship extraction). Explorer is an optional separately built UI and does not need
# those model families. We do enable graph-native decision and NetworkX/SciPy analytics.
# ContextGraph needs the five packages below for that profile. So the
# install is two commands, and the second one is why:
#
#   uv pip install -e ".[ledger]"
#   uv pip install --no-deps semantica==0.6.6
#
# Pinned exactly, not floored: this is a young library and the ledger reaches into its
# decision registry to rehydrate it after a load (see SemanticaLedger._rehydrate), which is
# private API. A version bump is a change to review, not one to pick up silently.
ledger = [
    "rdflib>=6.2",
    "networkx>=2.8",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "python-dateutil>=2.9",
]
# Private, localhost-only reviewer UI. These are exactly Semantica 0.6.6's Explorer runtime
# dependencies; keeping them in a separate extra preserves the lean ledger-only install.
ledger-ui = [
    "fastapi>=0.109.2,<1",
    "uvicorn[standard]>=0.22.0,<1",
    "websockets>=15.0.1,<16",
    "python-multipart>=0.0.7,<1",
    "defusedxml>=0.7.1,<1",
]

[project.scripts]
acr = "acr.mvp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acr"]

[tool.ruff]
line-length = 100
target-version = "py312"

# THE RULESET IS DECLARED, and that is the point of this block. With no `select`, ruff lints against
# whatever its own default set happens to be in the version CI installed — and `ruff>=0.8` installs
# the newest. Between 0.8 and 0.16 that default grew, so `ruff check src/ tests/ tools/` went from
# clean to 131 findings with no commit touching any of them, and the CI step has been red ever since
# without carrying any information. A check whose meaning changes when nobody edits it is the same
# defect this tree names elsewhere as an inert guard: it cannot be read either way.
#
# So: the rules are named here, and adding one is a decision with a diff. E4/E7/E9/F are the import,
# statement and undefined-name errors that catch real bugs; I keeps import blocks stable so a
# generated repository's diff is about code.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_openrouter: paid end-to-end test using real OpenRouter Luna and Terra plus Langtrace",
]
