[project]
name = "agentic-chart-review"
version = "0.1.0"
description = "Agentic EHR chart review: a ReAct-with-replanning agent that reviews clinical notes the way a human abstractor does, under a frozen, machine-checkable extraction specification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xing He" }]
keywords = ["ehr", "chart-review", "clinical-nlp", "agents", "langgraph", "litellm"]

dependencies = [
    "litellm>=1.55",
    "langgraph>=0.2.60",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
acr = "acr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
