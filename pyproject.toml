[project]
name = "agentic-chart-review"
version = "0.1.0"
description = "Agentic EHR chart review: a ReAct-with-replanning agent that reviews clinical notes the way a human abstractor does, under a frozen, machine-checkable extraction specification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xing He" }]
keywords = ["ehr", "chart-review", "clinical-nlp", "agents", "langgraph", "litellm"]

dependencies = [
    "deepagents>=0.6.12,<0.7",
    "langchain>=1.3.11,<2",
    "langchain-openai>=1.4.1,<2",
    "litellm>=1.55",
    "langgraph>=1.2.5,<1.3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]
reports = ["openpyxl>=3.1"]
# Only `acr.mcp_server` needs this, and it imports the SDK lazily so the rest of the package
# still runs without it. Kept out of the base dependencies for that reason.
mcp = ["mcp[cli]>=1.28"]

[project.scripts]
acr = "acr.cli:app"
acr-mcp = "acr.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
