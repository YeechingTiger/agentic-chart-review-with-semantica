# GENERATED by merging icdo3_lung.yaml + icdo3_colorectal.yaml. Do not hand-edit; edit the
# sources and regenerate, or the provenance below stops being true.
table_id: ICDO3-MULTISITE
table_version: 0.1.0
source_authority:
  document: ICD-O-3 (International Classification of Diseases for Oncology, 3rd edition)
  version_binding: NOT_BOUND
  status: model-recalled draft; no clinical or registrar sign-off
  scope: lung/bronchus (C34) and colorectal/anal (C18-C21) primaries
  origin: model_recalled
  basis: mechanically merged from codes/icdo3_lung.yaml and codes/icdo3_colorectal.yaml on 2026-07-30.
    No entry was authored here; every one carries the provenance of the table it came from, and both were
    RECALLED BY A LANGUAGE MODEL rather than transcribed from ICD-O-3.
  what_a_human_must_check: 'the same items the two source tables name, plus the merge itself: a morphology
    that means different things in the two organs would be silently unified here. 8140 adenocarcinoma
    is common to both and is the same entity; check the rest.'
  why_this_exists: 'an ARM, not a production table. The lung table alone anchors the answer to the lung
    by construction -- measured: 98 of 98 answered topographies were C34x. That makes it impossible to
    tell how much of the site accuracy is capability and how much is the value domain. This table offers
    two organs so the model has to discriminate, which is the test.'
behavior:
  '0':
    meaning: benign
    reportable: false
  '1':
    meaning: uncertain whether benign or malignant; borderline
    reportable: false
  '2':
    meaning: carcinoma in situ; non-invasive; intraepithelial
    reportable: true
  '3':
    meaning: malignant, primary site
    reportable: true
  '6':
    meaning: malignant, metastatic site
    reportable: false
    note: never the answer for a PRIMARY-site abstraction. If the specimen came from a metastasis, the
      primary site is still the organ of origin and behaviour stays 3.
  '9':
    meaning: malignant, uncertain whether primary or metastatic
    reportable: false
    note: not used by this repository's specs; recorded so an unexpected 9 is recognisable
topography:
  C340:
    name: Main bronchus
    aliases:
    - main bronchus
    - mainstem bronchus
    - left mainstem
    - right mainstem
    - carina
    note: a specimen taken FROM the main bronchus does not make the main bronchus the origin. A bronchoscopic
      biopsy of a mass obstructing a lobe is a specimen from the bronchus and a tumour of the lobe.
  C341:
    name: Upper lobe, lung
    aliases:
    - upper lobe
    - RUL
    - LUL
    - right upper lobe
    - left upper lobe
    - apex
    - apical
  C342:
    name: Middle lobe, lung
    aliases:
    - middle lobe
    - RML
    - right middle lobe
    note: RIGHT LUNG ONLY. The left lung has no middle lobe — see `laterality`.
  C343:
    name: Lower lobe, lung
    aliases:
    - lower lobe
    - RLL
    - LLL
    - right lower lobe
    - left lower lobe
    - basilar
  C348:
    name: Overlapping lesion of lung
    note: ONE tumour crossing two or more subsites whose point of origin cannot be determined. Multiple
      separate tumours in different subsites of one lung take C349.
  C349:
    name: Lung, NOS
    nos: true
    note: asserts the subsite is not documented. A real registry answer — 9.6% of this corpus — and the
      right one when the record genuinely does not localise or when it localises inconsistently for one
      tumour. Radiology and operative notes routinely state the lobe when the pathology says only which
      lung.
  C339:
    name: Trachea
    note: a different primary from lung; not a C34 subsite
  C384:
    name: Pleura
    note: mesothelioma arises here; a pleural primary is not a lung primary
  C180:
    name: Cecum
  C181:
    name: Appendix
  C182:
    name: Ascending colon
    aliases:
    - right colon
  C183:
    name: Hepatic flexure of colon
  C184:
    name: Transverse colon
  C185:
    name: Splenic flexure of colon
  C186:
    name: Descending colon
    aliases:
    - left colon
  C187:
    name: Sigmoid colon
    aliases:
    - sigmoid
  C188:
    name: Overlapping lesion of colon
    note: one tumour crossing two or more colonic subsites whose point of origin cannot be determined.
      Subcategory 8 is for ONE overlapping tumour; multiple separate tumours in different subsites of
      the colon take C189.
  C189:
    name: Colon, NOS
    nos: true
  C199:
    name: Rectosigmoid junction
  C209:
    name: Rectum, NOS
  C210:
    name: Anus, NOS
    nos: true
  C211:
    name: Anal canal
  C212:
    name: Cloacogenic zone
  C218:
    name: Overlapping lesion of rectum, anus and anal canal
