safeguards:
- C341 is the UPPER lobe. C342 is the MIDDLE lobe. C343 is the LOWER lobe.
- The left lung has no middle lobe. C342 with a left-sided tumour is anatomically impossible.
- A lobe code and a lobe word are the same claim written twice, so they cannot disagree. If your cited
  evidence names a lobe, the code must be that lobe's code — or say which statement describes the ORIGIN
  and why the other does not.
- Behaviour 0 and 1 are not reportable. A granuloma, a hamartoma or a benign polyp is not the reportable
  tumour.
- A four-digit number that is not in the table above is not a morphology code. If the diagnosis has no
  ICD-O-3 morphology, say the finding is not a reportable neoplasm rather than choosing a number that
  looks like one.
- A carcinoid tumour is behaviour 3 in ICD-O-3 and is reportable, whatever the clinical note calls it.
- A specimen taken from the main bronchus, a lymph node or a metastasis does not make that site the origin.
  Code the organ of origin with behaviour 3.
- 8972 pulmonary blastoma and 8973 pleuropulmonary blastoma are different diseases. Check which one the
  pathology names.
- Behaviour 0 and 1 are not reportable. A benign polyp is not the reportable tumour.
- A morphology code that is not in the table above is not a code. If the diagnosis has no ICD-O-3 morphology,
  the honest answer is that the finding is not a reportable neoplasm — not a four-digit number that looks
  like one.
- Squamous morphologies belong to the anus and anal canal. A squamous carcinoma coded to a colonic subsite
  should be explained.
- C188 is ONE tumour overlapping subsites with an undeterminable origin. Multiple separate tumours in
  different colonic subsites take C189.
- A specimen taken from a metastasis does not make the metastatic site the primary. Code the organ of
  origin with behaviour 3.
- This table spans TWO organ groups. A chart may document a neoplasm in either, and a lung primary with
  a colonic polyp is not a colorectal case. Code the tumour the registry is asking about, and say in `reported_lesion`
  why the other is not it.
