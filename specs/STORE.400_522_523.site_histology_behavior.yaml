spec_id: STORE.400_522_523.site_histology_behavior
spec_version: 0.1.0
source_authority:
  document: "CoC STORE 2025 (updated 2025-04-24)"
  items: ["Primary Site [400]", "Histology [522]", "Behavior Code [523]"]
  applicability: "cases diagnosed 2025-01-01 onward; Solid Tumor Rules apply to dx 2007-01-01 onward"
data_source: notes

question: >
  For the tumour being reported, what are the ICD-O-3 primary site (topography), the
  4-digit histology (morphology), and the 1-digit behaviour code?

fields:
  - name: primary_site
    type: string
    format: "C\\d{3}"
    description: "ICD-O-3 topography of the site of ORIGIN, no decimal point"
  - name: histology
    type: string
    format: "\\d{4}"
    description: "ICD-O-3 morphology, 4 digits, WITHOUT the behaviour digit"
  - name: behavior
    type: string
    allowable_values: ["0", "1", "2", "3"]
    description: "0 benign, 1 borderline, 2 in situ, 3 invasive"

decision_rule:
  - "Record the ICD-O-3 topography code for the site of ORIGIN, not the site of a biopsy or a metastasis."
  - "Code the FINAL pathologic diagnosis for solid tumours."
  - "Code behaviour 3 if any malignant invasion is present, no matter how limited."
  - "If the specimen is from a metastatic site, code the histology of the metastatic site and behaviour 3."
  - "Behaviour 2 requires that the process be confined to the epithelium with no stromal invasion."
  - "8000 (cancer, NOS) and 8010 (carcinoma, NOS) are NOT interchangeable; if the physician says carcinoma, code 8010."
  - "A single tumour overlapping two or more subsites with unknown origin takes subcategory 8; multiple tumours in different subsites of one organ take subcategory 9."

evidence_rules:
  counts_as_evidence:
    - "A pathology report's FINAL DIAGNOSIS or MICROSCOPIC DESCRIPTION."
    - "A cytology report may establish behaviour only when corroborated by tissue or an explicit clinical diagnosis."
  does_not_count:
    - "Imaging reports. Radiology can localise a mass; it cannot establish histology or behaviour."
    - "A problem-list entry or a restatement in a progress note, when no pathology exists in the chart."
    - "An assertion that a biopsy was done elsewhere, when that report is not in the record."

when_not_to_use:
  - "Lymphoma, leukaemia and other haematopoietic neoplasms — those follow the Hematopoietic and Lymphoid Neoplasm rules."
  - "Cases diagnosed before 2007-01-01 (Solid Tumor Rules do not apply)."

conflict_rules:
  - if: "the final pathologic diagnosis is less specific than the microscopic description"
    then: "take the more specific one (STORE example: microscopic 'adenocarcinoma' over final 'carcinoma NOS' -> 8140)"
  - if: "two pathology reports disagree"
    then: "prefer the definitive resection over the initial biopsy; cite both"
  - if: "a consult note restates a finding that the primary report contradicts"
    then: "prefer the primary report and record the contradiction as evidence with stance=contradicts"

proof_obligation:
  for_positive: "One pathology report establishing the histology, plus a statement of the site of origin."
  for_negative:
    mode: stratified_exclusion
    confidence: 0.95
    strata:
      - name: can_establish
        # Pathology/cytology can single-handedly establish histology -> witness-style
        # stratification by DOCUMENT TYPE (P3d). Small stratum, so exhaustive is affordable
        # and it contributes exactly zero elusion.
        #
        # `establishes` scopes the stratum to the fields it actually speaks to. Without it
        # one stratification serves all three fields, and every CT and PET lands in a
        # stratum named `cannot_establish` — which is true of histology and behaviour and
        # FALSE of primary_site, since this spec says plainly that radiology can localise a
        # mass. Patient P03 was coded C349 (lung NOS) on 2026-07-26 while
        # "right upper lobe" sat in seven other note types.
        establishes: [histology, behavior, primary_site]
        match: {doc_type_matches: ["Pathology", "Cytology"]}
        policy: exhaustive
      - name: may_mention
        establishes: [histology, behavior, primary_site]
        match: {doc_type_matches: ["Progress-Note", "Consult", "Discharge", "Endoscopy", "Procedure-Note"]}
        policy: search_then_read_hits_and_sample_misses
        required_keywords: ["pathology", "biopsy", "final diagnosis", "specimen", "carcinoma"]
        min_sample_of_misses: 25
        max_tolerated_hits: 0        # a hit falsifies the keyword list
      - name: cannot_establish
        # Cannot establish HISTOLOGY or BEHAVIOUR. It is not silent on primary_site:
        # cross-sectional imaging localises the tumour, and evidence_rules below say so
        # outright. Declaring that here stops the stratum name from teaching the agent the
        # opposite of what the spec says.
        establishes: [primary_site]
        match: {rest: true}          # RxHub fills, EKG, fluoroscopy, unrelated imaging
        policy: validate_by_sampling
        min_sample: 25
        max_tolerated_hits: 0        # a hit overturns the exclusion declaration
    gate:
      require_can_establish_nonempty: true
      exhaustive_strata_complete: true
      required_keywords_all_searched: true
      exclusion_validated: true
      keyword_list_validated: true
      max_elusion_upper: 0.12
    statement: >
      If no pathology is present in the record you must NOT infer histology from imaging or
      from a clinical assertion. Answer EVIDENCE_INSUFFICIENT for histology and behaviour,
      and say plainly that the diagnosis is radiographic/clinical without tissue confirmation.
      You may still report primary_site if the site of origin is documented.

abstention:
  EVIDENCE_INSUFFICIENT: "No pathology in the chart, or pathology present but the histology is not stated."
  SPEC_INSUFFICIENT: "A haematopoietic neoplasm, or a case this spec explicitly excludes."

special_codes_not_mar:
  - "Missing behaviour is not missing-at-random: it clusters on outside-hospital biopsies and declined biopsies, which differ prognostically."

boundary_cases:
  - case: "Intraductal carcinoma with focal areas of invasion"
    behavior: "3"
    why: "Any invasion, however limited, forces behaviour 3."
  - case: "Urothelial carcinoma in situ, no stromal invasion identified"
    behavior: "2"
  - case: "Atypical meningioma invading skull bone"
    behavior: "1"
    why: "Meninges can invade bone without being malignant; do not upgrade unless explicitly stated."
  - case: "CT shows a sigmoid mass; GI note says 'known colon cancer'; biopsy was done at an outside hospital and is not in the chart"
    answer: "EVIDENCE_INSUFFICIENT for histology and behaviour; primary_site may still be coded"

search_hints:
  - pathology
  - biopsy
  - "final diagnosis"
  - specimen
  - carcinoma
  - adenocarcinoma
  - resection
  - cytology

# Deterministic post-checks on a submitted answer, enforced in code (src/acr/answer_checks.py)
# rather than hoped for in the prompt. Every rule below is already stated in decision_rule or
# conflict_rules above; these three were nonetheless broken on real charts on 2026-07-26, so
# they are now mechanically decided and rejected through the same loop as the coverage gate.
# The clinical content lives here, in the spec, where a registrar can review it -- the checker
# itself contains no oncology.
answer_checks:
  - field: primary_site
    kind: not_less_specific
    nos_values: ["C349"]
    contradicted_by:
      ["upper lobe", "middle lobe", "lower lobe", "main bronchus",
       "RUL", "RML", "RLL", "LUL", "LLL"]
    message: >
      A documented lobe or main bronchus gives a specific ICD-O-3 subsite; C349 asserts the
      subsite is unknown. Radiology may be used for this -- it localises, it just cannot
      establish histology or behaviour.

  - field: primary_site
    kind: nos_requires_search
    nos_values: ["C349"]
    required_searches: ["lobe", "bronchus"]
    message: >
      C349 asserts no subsite is documented. Radiology and operative notes routinely state
      the lobe even when pathology says only "right lung", and this spec permits radiology
      for localisation. Search for it before claiming it is absent.

  - field: primary_site
    kind: origin_not_specimen
    specimen_markers: ["specimen received", "specimen:", ", biopsy:", "fine needle", "fna"]
    message: >
      Rule 1: code the site of ORIGIN, not the site of a biopsy or a metastasis. A specimen
      taken from the main bronchus does not make the main bronchus the origin.

  - field: primary_site
    kind: conflict_requires_nos
    nos_value: "C349"
    mutually_exclusive:
      - ["upper lobe", "RUL", "LUL"]
      - ["middle lobe", "RML"]
      - ["lower lobe", "RLL", "LLL"]
      - ["main bronchus"]
    message: >
      Two documents can name two different lobes for one tumour -- an operative note
      describing where the surgeon went, a pathology header naming the container the
      specimen arrived in, a radiology report describing a second lesion. Coding the first
      lobe you read is not a decision, it is an order-of-reading artefact. Say which
      statement describes the ORIGIN and why the other does not, or code C349.

  - field: histology
    kind: not_less_specific
    nos_values: ["8000", "8010", "8046"]
    contradicted_by:
      ["squamous", "adenocarcinoma", "small cell", "large cell",
       "favor squamous", "adenosquamous"]
    message: >
      Conflict rule: where the record is more specific than the summary line, take the more
      specific reading. "favor squamous cell carcinoma" supports 8070 over 8046.

# ------------------------------------------------------------------------------ provenance
# WHY THIS BLOCK EXISTS, and it is a fact about this file rather than about the software.
# All four original specs in this tree were written by a language model in ONE commit --
# e5229b0, 2026-07-25 -- from whatever manual text happened to be in its context, and were
# committed under a human author's name. The stage spec was written by an agent on
# 2026-07-26. NO REGISTRAR OR PHYSICIAN HAS READ A LINE OF ANY OF THEM. Transcribed lines,
# inferred lines and invented lines are all present, mixed, and to a reader they are
# identical: they are all just YAML.
#
# One record per ENFORCED element -- the lines some code path changes behaviour on. Missing
# one makes this file refuse to load. The advisory half for the sentences a human reads
# rather than the runtime lives in `editorial_provenance`, where a missing record is a
# finding printed in the review document instead of an error.
#
# origin: model_authored is not modesty. It is the accurate answer for every element below.
# `store_manual` and `ajcc_manual` require a section, item or rule number IN THE BASIS, and
# nothing here has one, because nothing here is a line a manual states: these are regexes,
# coverage-gate switches, document-type groupings and sample sizes, all invented in this
# repository. The four code tables come closest, and they were recalled by a model, not
# copied out of the manual -- so they say so, and they name the item a human should check
# them against.
provenance:
  - element: "fields[primary_site].format"
    origin: model_authored
    status: draft
    basis: >-
      no external source; written by a language model in commit e5229b0 (2026-07-25) and
      committed under a human author's name. Constrains a topography code to a letter and three
      digits and nothing else. It accepts codes that name no real site and rejects the
      punctuated form the manual writes, so it is a shape check, not a validity check.
  - element: "fields[histology].format"
    origin: model_authored
    status: draft
    basis: >-
      no external source; written by a language model in commit e5229b0 (2026-07-25) and
      committed under a human author's name. Constrains a morphology code to four digits and
      nothing else. It cannot tell a real morphology from a well-formed invented one, and it
      does not know which morphologies are possible in the lung.
  - element: "fields[behavior].allowable_values"
    origin: model_authored
    status: draft
    basis: >-
      no external source; written by a language model in commit e5229b0 (2026-07-25) and
      committed under a human author's name. A code table. Nobody compared this list against the
