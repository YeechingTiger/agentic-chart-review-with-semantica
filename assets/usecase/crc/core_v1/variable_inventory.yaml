    registry_to_rule:
      semantic: exact
      temporal: exact
      decision_boundary_preserved: true
      status: inferred_from_mapping_level_requires_use_specific_review
    canonical_to_registry:
      level: direct
      transformation_id: null
      status: candidate
    observed_availability:
      status: NOT_ASSESSED
