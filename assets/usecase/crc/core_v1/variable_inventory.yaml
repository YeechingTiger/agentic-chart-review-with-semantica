schema_version: '1.0'
bundle_id: CRC.CORE.MOLECULAR_TREATMENT.v1
clinical_use: NOT_FOR_CLINICAL_USE
templates:
  no_registry: &id003
    standard: none
    item_name: none
    item_number: none
    xml_id: none
    effective_years: none
  runtime_coverage_blocked: &id004
    verdict: needs_revision
    issues:
    - The candidate contract loads natively, but runtime proves keyword searches rather than the required molecular-report/pathology-addendum document coverage.
    - Add a document-category coverage operator before codes 8 or 9 can satisfy the declared proof obligation.
  needs_review: &id002
    verdict: needs_revision
    issues:
    - The candidate is structurally specified but contains unmeasured model-authored domains or source precedence requiring specialist review.
  production_owner_blocked: &id001
    verdict: needs_revision
    issues:
    - A candidate contract exists, but the current production owner in specs/ fails provenance enforcement and promotion/collision resolution is pending.
variables:
- variable_id: crc.primary_site
  label: Primary site ICD-O-3
  roles:
  - eligibility
  datatype: string
  value_domain: CRC.CANDIDATE.disease_context#primary_site_icdo3
  temporal_meaning: tumor_record_identity
  mapping_level: registry_direct
  registry_mapping:
    standard: NAACCR_v26
    item_name: Primary Site
    item_number: '400'
    xml_id: primarySite
    effective_years: all
  extraction:
    spec_id: CRC.CANDIDATE.disease_context
    field: primary_site_icdo3
    status: specified
  source_documents:
  - pathology
  - endoscopy
  - operative_report
  - registry
  excluded_sources:
  - problem_list_only
  missingness_semantics: Null/unknown is not C189/C209; NOS topography requires an absence proof.
  conformance: *id001
  variable_contract:
    contract_id: CRC.VAR.primary_site
    contract_version: 0.1.0
    contract_hash: c5e50443270e743c9b8f68f22f7251f9f5af4785851ad1c0e5bf00a76f265d99
