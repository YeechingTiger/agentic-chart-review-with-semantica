    accessed_on: "2026-07-27"
    scope: registry data items and first-course treatment coding for diagnosis year 2026+
    use: Primary STORE-centered mapping authority.
    limitations: Required status is not evidence that a field exists or is complete in the linked extract.

  - <<: *official_source_draft
    source_id: NAACCR.SSDI.3_3
    authority: NAACCR
    title: Site-Specific Data Items and Grade Manual
    source_type: registry_standard
