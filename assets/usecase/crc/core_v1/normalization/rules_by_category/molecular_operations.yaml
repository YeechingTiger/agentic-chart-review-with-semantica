  source_anchor: Diagnosis recommendations bullet 1
  category: molecular_operations
  title: Histologic confirmation before therapy
  core_or_supplemental: core
  source_context:
    eligibility: Suspected metastatic colorectal cancer
    action: Confirm colorectal adenocarcinoma in primary or metastatic tissue
    timing: Before treatment
    exceptions: None stated
    predicate_logic: suspected_mcrc AND pretherapy => histologic_confirmation
  requirements:
    eligibility:
      expression: Suspected metastatic colorectal cancer
      variables:
      - crc.mcrc_suspicion_date
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.mcrc_suspicion_date
    action:
      expression: Confirm colorectal adenocarcinoma in primary or metastatic tissue
      variables:
      - crc.histology
      - crc.molecular_specimen_site
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.histology
        - variable: crc.molecular_specimen_site
    timing:
      expression: Before treatment
      variables:
      - crc.histologic_confirmation_date
      - crc.mcrc_suspicion_date
      - crc.treatment_start_date
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.histologic_confirmation_date
        - variable: crc.mcrc_suspicion_date
        - variable: crc.treatment_start_date
    exceptions:
      expression: None stated
      variables: []
      evidence_logic:
        op: constant
        value: true
        meaning: no_source_stated_evidence_requirement
      evidence_requirement_status: no_source_stated_evidence_requirement
  required_variables:
  - crc.histologic_confirmation_date
  - crc.histology
  - crc.mcrc_suspicion_date
  - crc.molecular_specimen_site
  - crc.treatment_start_date
