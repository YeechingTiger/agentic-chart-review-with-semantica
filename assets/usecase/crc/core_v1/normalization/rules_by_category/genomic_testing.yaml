  category: genomic_testing
  title: Genomic testing for approved biomarker-linked care
  core_or_supplemental: core
  source_context:
    eligibility: Advanced solid tumor with adequate performance status and an approved biomarker-linked therapy or genomic
      exclusion
    action: Perform genomic testing
    timing: Before linked treatment selection
    exceptions: Account for stage, PS, comorbidity, and life expectancy
    predicate_logic: advanced AND adequate_PS AND (approved_link OR genomic_exclusion) => test
  requirements:
    eligibility:
      expression: Advanced solid tumor with adequate performance status and an approved biomarker-linked therapy or genomic
        exclusion
      variables:
      - crc.candidate_biomarker_linked_therapy
      - crc.ecog_performance_status
      - crc.estimated_life_expectancy
      - crc.regulatory_approval_date
      - crc.regulatory_jurisdiction
      - crc.stage_group
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.candidate_biomarker_linked_therapy
        - variable: crc.ecog_performance_status
        - variable: crc.estimated_life_expectancy
        - variable: crc.regulatory_approval_date
        - variable: crc.regulatory_jurisdiction
        - variable: crc.stage_group
    action:
      expression: Perform genomic testing
      variables:
      - crc.genomic_test_status
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.genomic_test_status
    timing:
      expression: Before linked treatment selection
      variables:
      - crc.regulatory_approval_date
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.regulatory_approval_date
    exceptions:
      expression: Account for stage, PS, comorbidity, and life expectancy
      variables:
      - crc.ecog_performance_status
      - crc.estimated_life_expectancy
      evidence_logic:
        op: all_of
        operands:
        - variable: crc.ecog_performance_status
        - variable: crc.estimated_life_expectancy
  required_variables:
  - crc.candidate_biomarker_linked_therapy
  - crc.ecog_performance_status
  - crc.estimated_life_expectancy
  - crc.genomic_test_status
  - crc.regulatory_approval_date
  - crc.regulatory_jurisdiction
  - crc.stage_group
  computability:
    status: not_computable
    blockers:
    - B_DYNAMIC_LABEL
    - NORMALIZATION_CLINICAL_REVIEW_PENDING
    - LOCAL_OPERATIONALIZATION_REVIEW_PENDING
    - OUTSIDE_CURRENT_SOURCES
  review_status: pending
  clinical_use: NOT_FOR_CLINICAL_USE
