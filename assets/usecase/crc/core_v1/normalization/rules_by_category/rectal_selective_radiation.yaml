  - crc.rectal_response.imaging_category.post_neoadjuvant
  - crc.rectal_stage.clinical_t.pretreatment
  - crc.rectal_treatment.decision_date
  - crc.rectal_treatment.planned_pathway_at_decision
  - crc.rectal_treatment.start_date
