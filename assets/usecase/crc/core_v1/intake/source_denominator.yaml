schema_version: 1
artifact_id: crc_core_v1_source_denominator
repository_scope: agentic-chart-review-with-semantica
as_of_date: '2026-07-27'
scope:
  disease: colorectal_cancer
  focus:
    - molecular_testing_and_operations
    - localized_colon_adjuvant
    - locally_advanced_rectal_assessment_and_neoadjuvant_treatment
    - metastatic_molecular_systemic_treatment
    - resectable_and_oligometastatic_local_treatment
    - treatment_linked_lynch_reflex
  denominator_policy: >
    Formal recommendation counts describe source-authored recommendation units.
    Executable candidate counts additionally split source recommendations into
    branches and retain operational qualifiers. They must not be presented as
    independent guideline statements.
summary:
  core_formal_recommendations: 218
  core_nonformal_source_units: 37
  core_scoped_source_units: 255
  core_executable_candidates: 275
  all_sources_formal_recommendations_including_supplemental_and_adjacent: 223
  supplemental_or_adjacent_candidates: 5
  total_executable_candidates: 280
  nccn_candidates_reconstructed: 0
  completeness_claim: accessible_source_scoped_complete
denominator_semantics:
  formal_recommendations: >
    Count only source-authored formal recommendation parents. This is the
    clinical-guideline denominator. It excludes good-practice statements,
    operational qualifiers, explicit prose branches, and executable splits.
  nonformal_source_units: >
    Source-authored good-practice statements, operational qualifiers, or
    explicitly extracted source branches that are in scope but are not formal
    recommendations.
  scoped_source_units: >
    Formal recommendations plus nonformal source units reviewed in the declared
    scope. This is a source-review denominator, not a formal-recommendation count.
  executable_candidates: >
    Rule candidates after splitting conditions, alternatives, exceptions, and
    operational obligations. Multiple candidates may share one formal parent.
  candidate_projection_for_core_formal_coverage: >
    In rule_universe.yaml, take distinct parent_recommendation_id among entries
    with core_or_supplemental equal to core, excluding candidate_kind
    good_practice and adjacent. Shared multi-recommendation qualifiers use a
    primary parent plus related_parent_recommendation_ids and therefore do not
    create synthetic parent IDs.
