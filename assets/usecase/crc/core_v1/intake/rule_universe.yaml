candidate_count_expected: 280
field_notes:
  parent_recommendation_id: >
    Primary source-authored parent unit. For core formal coverage, distinct-count
    this field after excluding good-practice and adjacent candidates. A
    multi-recommendation qualifier uses one primary parent and records every
    applicable parent in related_parent_recommendation_ids.
  candidate_kind: One of formal_recommendation, executable_branch, operational_qualifier, good_practice, or adjacent.
  predicate_logic: Compact implementation-oriented summary; it is not executable production code.
  blockers: References blocker codes defined below.
blocker_definitions:
  B_COPYRIGHT_PARAPHRASE: Store paraphrase, source locator, version, and hash; do not persist substantial source text.
  B_DYNAMIC_LABEL: Drug approval, availability, age range, and jurisdiction must be checked as of the decision date.
  B_SOURCE_CONFLICT: Source-specific recommendations conflict and require clinical adjudication before unification.
  B_LOCAL_CLOCK: The time-to-result clock origin or working-day calendar requires a local definition.
  B_OPERATIONAL_INFERENCE: Part of the predicate is an operational inference rather than explicit source wording.
  B_ASSAY_DEFINITION: Assay, positivity, pathogenicity, or phenotype definition must be resolved before activation.
  B_HEREDITARY_PARTIAL: Treatment-linked Lynch reflex is not a complete hereditary-risk workflow.
  B_CAP_UPDATE: CAP 2017 guideline update is pending; treatment-era statements require current review.
  B_HISTORICAL_ONLY: Retain for provenance; do not activate as a current treatment rule.
  B_ASTRO_VERSION: Compare the accepted manuscript with the final version of record before activation.
  B_SITC_LIVING: Reconcile the 2023 publication with the 2025 living update.
  B_SUPPLEMENT_ONLY: Selected interpretation guard only; not an exhaustive source extraction.
  B_DPD_IMPLEMENTATION: Numeric DPD action requires current pharmacogenomic, regulatory, and jurisdiction review.
  B_OFF_LABEL: Recommendation was off-label or unapproved in at least one publication jurisdiction.
  B_HUMAN_REVIEW: Predicate or action requires human clinical review and cannot be auto-activated.
  B_SERVICE_LEVEL: Aggregate service benchmark must not be scored as an individual-patient mandate.
  B_NCCN_DEPENDENCY: Current US adjudication remains incomplete until an authorized NCCN snapshot is ingested.
