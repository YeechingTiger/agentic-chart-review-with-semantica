spec_id: STORE.700_880.stage
spec_version: 0.1.0
source_authority:
  document: "AJCC Cancer Staging Manual 8th edition (Lung) + CoC STORE 2025 (updated 2025-04-24)"
  items:
    - "TNM Clin T / N / M and Clinical Stage Group"
    - "TNM Path T / N / M and Pathologic Stage Group"
    - "Summary Stage 2018"
  applicability: "lung primaries diagnosed 2018-01-01 onward (AJCC 8th)"
  note: >
    The numeric identifiers in spec_id follow this repository's file-naming convention.
    Reconcile them against the NAACCR data dictionary before this spec is used to populate a
    registry field. Nothing in the runtime reads source_authority; it is here for the human
    who has to approve the spec.
data_source: notes

question: >
  For the lung primary being reported, what are the AJCC 8th edition clinical stage
  (cT, cN, cM and clinical stage group), the AJCC 8th edition pathologic stage (pT, pN, pM
  and pathologic stage group), and the SEER Summary Stage 2018 code?

# Nine fields, because staging really is nine registry items. The clinical set and the
# pathologic set are DIFFERENT VARIABLES with different evidence, different timing and
# different owners; a single `stage` field would make the commonest error in this criterion
# -- conflating them -- unrepresentable and therefore invisible.
#
# Every `format` below is a Python regex (re.fullmatch), not registry notation. Writing
# "CCYYMMDD" here is what makes check_field_formats reject every valid value, as it currently
# does in STORE.390 and STORE.1860_1880.
fields:
  - name: clinical_t
    type: string
    format: "cT(X|0|is|1mi|1a|1b|1c|1|2a|2b|2|3|4)"
    description: "AJCC 8th clinical T, with the c prefix, e.g. cT2a. cTX means not assessable."
  - name: clinical_n
    type: string
    format: "cN(X|0|1|2|3)"
    description: "AJCC 8th clinical N, with the c prefix, e.g. cN2."
  - name: clinical_m
    type: string
    # No cMX. AJCC 8th assigns M0 clinically whenever there is no evidence of metastasis, so
    # "M could not be assessed" is not a clinical category. Excluding it from the pattern is
    # free enforcement of a real staging rule: an agent that wants to say "unknown" must leave
    # the field null and take the abstention, rather than hide behind an X.
    format: "cM(0|1a|1b|1c|1)"
    description: "AJCC 8th clinical M, e.g. cM1b. There is no cMX; leave null if undetermined."
  - name: clinical_stage_group
    type: string
    allowable_values:
      ["0", "OCCULT", "IA1", "IA2", "IA3", "IB", "IIA", "IIB",
       "IIIA", "IIIB", "IIIC", "IVA", "IVB", "99"]
    description: >
      AJCC 8th clinical stage group. OCCULT is cTX cN0 cM0 (positive cytology, tumour never
      visualised). 99 = documented nowhere in the record -- a negative claim, not a default.
  - name: pathologic_t
    type: string
    format: "pT(X|0|is|1mi|1a|1b|1c|1|2a|2b|2|3|4)"
    description: "AJCC 8th pathologic T from the resection specimen, with the p prefix."
  - name: pathologic_n
    type: string
    format: "pN(X|0|1|2|3)"
    description: "AJCC 8th pathologic N from the nodes actually removed and examined."
  - name: pathologic_m
    type: string
    # There is no pM0: absence of metastasis cannot be established by a specimen, only by the
    # clinical workup. A run that writes pM0 has copied cM0 across the c/p boundary, which is
    # exactly the conflation this spec exists to prevent -- so the regex refuses it.
    format: "pM1(a|b|c)?"
    description: "Only pM1, pM1a, pM1b, pM1c exist. There is no pM0 and no pMX; leave null."
  - name: pathologic_stage_group
    type: string
    allowable_values:
      ["0", "IA1", "IA2", "IA3", "IB", "IIA", "IIB",
       "IIIA", "IIIB", "IIIC", "IVA", "IVB", "99"]
    description: >
      AJCC 8th pathologic stage group. Requires resection of the primary; a biopsy alone
      never produces one. OCCULT is clinical-only and is absent here by design.
  - name: summary_stage
    type: string
    allowable_values: ["0", "1", "2", "3", "4", "7", "9"]
    description: >
      SEER Summary Stage 2018. 0 in situ, 1 localised, 2 regional by direct extension,
      3 regional lymph nodes only, 4 regional both, 7 distant, 9 unknown.

# Read by tests/test_stage_spec.py, not by the runtime. `proof_obligation` requires the agent
# to have searched for the terms below before any absence claim is accepted; this mapping is
# what makes "the keyword list covers every field" a checkable statement instead of a hope.
# Verified in test_every_field_is_reachable_by_a_required_search.
keyword_field_coverage:
  clinical_t: ["tnm", "tumor size", "pleural"]
  clinical_n: ["tnm", "lymph node"]
  clinical_m: ["tnm", "metasta"]
  clinical_stage_group: ["stage"]
  pathologic_t: ["tnm", "tumor size", "pleural"]
  pathologic_n: ["tnm", "lymph node"]
  pathologic_m: ["tnm", "metasta"]
  pathologic_stage_group: ["stage"]
  summary_stage: ["stage", "metasta"]

agent_policy: >
  Fill the clinical fields and the pathologic fields independently. A field you cannot
  support with a quote must be left null -- never borrow a value across the c/p boundary,
  never round a bounded ("at least") statement to a determined one, and do not report a
  stage group you have not seen stated unless you can quote all three of its categories.

decision_rule:
  - "Clinical stage and pathologic stage are separate data items. Never copy one into the other, and never mix a c-category and a p-category inside one stage group."
  - "Clinical stage uses all information acquired BEFORE the first treatment: examination, imaging, endoscopy, biopsy and surgical staging. It is fixed at that point and is not revised by what the resection later shows."
  - "Pathologic stage requires resection of the primary tumour; pN requires the nodes that were actually removed. A needle or endoscopic biopsy alone never produces a pathologic stage group."
  - "For the PATHOLOGIC categories the resection specimen supersedes imaging. It does not overwrite the clinical categories: both are recorded."
  - "There is no pM0 and no cMX. Absence of metastasis is a clinical determination (cM0); non-assessability is not a clinical M category."
  - "A bounded statement -- 'at least cT2a', 'at minimum stage IIB', 'T2 or greater' -- is a lower bound, not a determination. Record the categories that are determined and abstain on the rest."
  - "TX, NX and stage group 99 are positive claims that the value could not be assessed or is documented nowhere. They carry the same proof burden as EVIDENCE_INSUFFICIENT and must not be used as a shortcut for not having looked."
  - "A stage group must be consistent with its own T, N and M. Where a stated group contradicts the stated categories, prefer the categories and record the contradiction."
  - "Summary Stage is derived from the extent of disease documented anywhere in the record, not by translating the AJCC group."

evidence_rules:
  counts_as_evidence:
    - "The staging or synoptic section of a resection pathology report (pT, pN, 'AJCC pathologic stage')."
    - "An explicit stage statement by the treating medical oncologist, radiation oncologist, thoracic surgeon or tumour board, where the c/p qualifier is stated or unambiguous from the timing."
    - "Imaging establishes distant metastasis (M1) and supplies tumour size and nodal measurements. Those are inputs to a category, not the category itself."
  does_not_count:
    - "Imaging alone for a T, N or stage GROUP. Radiology measures; the category is a clinician's assignment. Distant metastasis is the one exception, and it is stated above."
    - "A stage carried forward in a problem list, note header or template when the record shows the workup has since changed the value."
    - "A stage stated for a different primary. A patient with two cancers has two stages and only one of them is being reported."
    - "A stage attributed to an outside facility whose report is not in this record."
    - "A bounded statement, and any stage group derived from one."

when_not_to_use:
  - "Post-neoadjuvant staging (yc / yp prefixes). Those are further separate data items and this spec does not define them."
  - "Small cell lung carcinoma staged in the record only as limited or extensive: that is not an AJCC group."
  - "Lymphoma and other haematopoietic neoplasms, which use Ann Arbor / Lugano."
  - "Cases diagnosed before 2018-01-01, where AJCC 7th applies and the group definitions differ."

# THE FACTS THE CONFLICT RULES TURN ON, declared once and referenced by `turns_on`.
discriminating_facts:
  - fact_id: staging_workup_complete_at_assessment
    asks: >-
      whether the staging workup was complete at the time each clinical stage assessment was made
    applicable_when: >-
      two clinicians state different clinical stage groups
  - fact_id: categories_justify_the_stated_group
    asks: >-
      whether the stated T, N and M categories justify the stated stage group under the declared staging system
    applicable_when: >-
      a stage group and its component categories are both stated

conflict_rules:
  - if: "the resection pathology and the pre-treatment imaging disagree on T or N"
    then: "the resection governs the PATHOLOGIC categories only; the clinical categories stay as they were staged before treatment. Cite both."
    no_discriminator: >-
      the clinical and pathologic axes are separate outputs by construction, so this rule partitio
      ns evidence between two fields rather than deciding between readings of one. No further fact
      about the chart changes which axis a report governs.
  - if: "two clinicians state different clinical stage groups"
    then: "prefer the assessment made once the staging workup was complete, and record the earlier one with stance=contradicts"
    turns_on: [staging_workup_complete_at_assessment]
  - if: "the stated stage group is inconsistent with the stated T, N and M"
    then: "prefer the categories, report the group you can justify, and record the contradiction"
    turns_on: [categories_justify_the_stated_group]
  - if: "the only stage statement in the record is bounded ('at least cT2a')"
    then: "report the determinable categories and EVIDENCE_INSUFFICIENT for the group; do not round the bound"
    no_discriminator: >-
      a bounded statement ('at least cT2a') is already the whole of what the record says. The rule
      refuses to round it, and no additional fact would make the bound determinate.

proof_obligation:
  for_positive: >
    One document stating the stage, with the c/p qualifier established by its timing relative
    to first treatment -- plus, for a pathologic group, evidence that the primary was resected.
  for_negative:
    mode: stratified_exclusion
    confidence: 0.95

    # THE ONLY REQUIRED-SEARCH ENFORCEMENT IN THE SYSTEM LIVES AT THIS KEY.
    # graph._check_gate loops over proof_obligation.required_keywords and fails the gate for
    # any term absent from coverage.searched_terms. Stratum-level required_keywords do NOT
    # feed the gate -- they only feed _keyword_hits_among_drawn. All four previously shipped
    # specs left this list empty, so `required_keywords_all_searched: true` in their gates
    # enforced nothing. Six terms, chosen so that none is a substring of another (the match is
    # bidirectional, so "stage" would otherwise silently discharge "pathologic stage" too).
    # Field coverage is asserted in keyword_field_coverage above.
    required_keywords:
      - stage        # both stage groups, summary_stage
      - tnm          # every T, N and M category
      - "tumor size" # T
      - pleural      # T (visceral pleural invasion is what makes a <=3 cm tumour T2a)
      - "lymph node" # N
      - metasta      # M, summary_stage

    strata:
      - name: can_establish
        # Documents that ASSIGN a stage rather than supply an input to one: the resection and
        # biopsy pathology family, and the oncology / thoracic-surgery / tumour-board
        # assessments where the clinical group is actually decided. Both halves are needed --
        # pathology alone cannot establish a clinical stage, and a patient who never had
        # surgery has no pathologic stage at all, so a pathology-only stratum would teach the
        # agent that an unresected patient is unstageable.
        #
        # Enumerated rather than matched on "Pathology", because doc_type_matches is a
        # case-insensitive SUBSTRING: "Pathology" pulls in Speech-Language-Pathology-Note and
        # misses Fine-Needle-Report, Core-Needle-Biopsy and IMMUNOHISTOLOGY-RPT. Measured on
        # the real corpus 2026-07-26; measured again here -- this list selects 53 of the 1,516
        # real document types and Speech-Language-Pathology-Note is not one of them.
        establishes:
          [clinical_t, clinical_n, clinical_m, clinical_stage_group,
           pathologic_t, pathologic_n, pathologic_m, pathologic_stage_group, summary_stage]
        match:
          doc_type_matches:
            ["Surgical-Pathology", "Anatomic-Pathology", "Tissue-Pathology", "Medical-Pathology",
             "Pathology-Report", "MOLECULAR-PATHOLOGY", "IMMUNOHISTOLOGY", "Cytology",
             "Fine-Needle", "Core-Needle", "Needle-Bx",
             "Tumor-Board", "Thoracic-Tumor", "Thoracic-Surg",
             "Onc-Med", "Hem-Onc", "Rad-Onc", "Radiation-Oncology", "Radiation-Therapy",
             "General-Onc", "Operative-Note", "OPERATIVE-REPORT", "Gen-Surgery-OP-Letter"]
        policy: exhaustive

      - name: cannot_establish
        # Declared BEFORE may_mention and enumerated, so that may_mention can take `rest`.
        # An unrecognised document type then defaults to "search it and sample the misses"
        # rather than to "assume it is irrelevant and sample 25". Unmentioned means unjudged,
        # and the safe default for unjudged is to look -- the same rule coverage_planner
        # applies to a type the planner did not mention.
        #
        # This inverts STORE.400_522_523, where `rest` was cannot_establish. That shape is
        # fragile here: exclusion_validated fails the moment a drawn document turns out to be
        # citable, and under this criterion a spine film showing a bone metastasis IS citable
        # (it establishes M1b). Every type below is inert for all nine fields.
        establishes: []          # genuinely silent on every field -- see the caveat below
        match:
          doc_type_matches:
            ["EKG", "Electrocardiogram", "ELECTRONYSTAGMOGRAM",
             "Prescriptions-Filled-RxHub", "DISCHARGE-PRESCRIPTIONS", "Discharge-Meds",
             "Med-Reconciliation", "Medication-Reconciliation-Note",
             "Fluoroscopy-Up-to-1-Hr",
             "Aud-Speech-Path", "Speech-Language-Pathology", "Dental-MD"]
        policy: validate_by_sampling
        min_sample: 25
        max_tolerated_hits: 0    # a hit overturns the exclusion declaration

      - name: may_mention
        # Everything else: cross-sectional imaging, PET, plain films, endoscopy, procedure
        # notes, discharge summaries and every non-oncology progress note. These restate a
        # stage constantly and imaging supplies the measurements behind T, N and M, so the
        # obligation is to SEARCH them and then sample what the search missed.
        establishes:
          [clinical_t, clinical_n, clinical_m, clinical_stage_group,
           pathologic_t, pathologic_n, pathologic_m, pathologic_stage_group, summary_stage]
        match: {rest: true}
        policy: search_then_read_hits_and_sample_misses
        # Feeds _keyword_hits_among_drawn only, which lowercases and drops terms of length
        # <= 3 -- so "tnm" is invisible here however it is written. It is still gated at
        # for_negative.required_keywords above, which has no length filter.
        required_keywords:
          ["stage", "staging", "ajcc", "tumor size", "pleural", "lymph node",
           "mediastinal", "metasta", "nodal", "extent of disease"]
        min_sample_of_misses: 25
        max_tolerated_hits: 0    # a hit falsifies the keyword list

    gate:
      require_can_establish_nonempty: true
      exhaustive_strata_complete: true
      exclusion_validated: true
      keyword_list_validated: true
      # 25 documents sampled with zero hits gives a Clopper-Pearson upper bound of 0.1129,
      # so any cap below that makes the gate unpassable no matter how much work is done.
      max_elusion_upper: 0.12
    statement: >
      Do not assign a stage group from imaging alone, from a bounded statement, or from a
      stage recorded for a different primary. If the record carries no stage for this primary,
      answer EVIDENCE_INSUFFICIENT and say which categories, if any, are determinable. If the
      primary was never resected there is no pathologic stage and that is a finding, not a gap.

abstention:
  EVIDENCE_INSUFFICIENT: >
    No stage documented for this primary; or only a bounded ('at least') statement; or the
    only stage in the record belongs to a different primary; or the primary was never resected
    and only the pathologic fields are missing.
  SPEC_INSUFFICIENT: >
    Post-neoadjuvant yc/yp staging, small cell staged only as limited/extensive, a
    haematopoietic neoplasm, or a case diagnosed before 2018-01-01 under AJCC 7th.

special_codes_not_mar:
  - >
    Unknown stage is not missing at random: it clusters on patients who never reached an
    oncology consultation and on workups done at an outside facility, and both groups differ
    in survival from the staged population. Report the abstention, do not minimise it.

boundary_cases:
  - case: "Synoptic report reads 'pT2a pN1 cM0, AJCC pathologic stage IIB'; no pre-treatment stage is stated anywhere"
    answer: "pathologic_* filled; clinical_* EVIDENCE_INSUFFICIENT"
    why: "cM0 inside a pathologic synoptic is the clinical M being carried into the p-group. It is not a clinical stage group."
  - case: "Oncology note: 'clinically at least T2a, N status pending mediastinoscopy'"
    answer: "clinical_stage_group EVIDENCE_INSUFFICIENT; clinical_t EVIDENCE_INSUFFICIENT"
    why: "A lower bound is not a determination, and a pending N cannot be read as cN0."
  - case: "3.2 cm upper lobe mass with visceral pleural invasion, no nodes, no metastasis, no resection"
    answer: "clinical_t cT2a, clinical_n cN0, clinical_m cM0, clinical_stage_group IB, summary_stage 1"
    why: "All three categories quotable, so the group may be reported. No resection means no pathologic stage."
  - case: "Pre-treatment staging documents a separate tumour nodule in a different ipsilateral lobe"
    answer: "clinical_t cT4"
    why: "The clinical field must carry its c-prefix: same lobe is cT3, different ipsilateral lobe is cT4, contralateral lung is cM1a."
  - case: "Malignant pleural effusion"
    answer: "cM1a, summary_stage 7"
    why: "Pleural or pericardial effusion or nodules are M1a, not a T descriptor."
  - case: "PET-CT reports a solitary adrenal metastasis; no clinician has ever written a stage"
    answer: "clinical_m cM1b, summary_stage 7; clinical_stage_group EVIDENCE_INSUFFICIENT"
    why: "Imaging establishes M. It does not assign a group, and IVA cannot be inferred without T and N."

search_hints:
  - stage
  - staging
  - AJCC
  - TNM
  - "pathologic stage"
  - "clinical stage"
  - "tumor size"
  - pleural
  - "lymph node"
  - mediastinal
  - metasta
  - metastasis
  - resection
  - lobectomy
  - "tumor board"
  - "extent of disease"
# ------------------------------------------------------------------ answer_checks: REMOVED
# This spec used to declare deterministic post-checks that decided clinical questions by
# matching word lists against the model's own cited quotes. All of them were removed on
# 2026-07-30 after being measured over every trace this project has recorded (266 traces, 202
# joinable to registry gold, 122 firings):
#
#   not_less_specific        22 fires   22 rejected the registry's own value    0 ever helped
#   nos_requires_search      24 fires   21 rejected the registry's own value    0 ever helped
#   conflict_requires_nos    67 fires   18 rejected the registry's own value   15 "helped"
#   origin_not_specimen       2 fires    0                                      0
#   code_matches_cited_text   0 fires    -                                      -
#
# `conflict_requires_nos` looked like it broke even. All 15 of its helps were the same event,
# a push to C349, because that is the only remedy its message offers -- and C349 is the
# registry's answer for 9.6% of this corpus against C341's 52.7%. It never helped a run reach
# a specific subsite.
#
# Counted per submission: 60 of 254 recorded rejections refused a tuple that was exactly the
# registry's, and 12 runs held the exact registry answer and shipped something else -- 8 of
# them shipped nothing at all.
#
# The clinical content these checks encoded is NOT lost: every one of them restated a rule
# that is already written above in `decision_rule` and `conflict_rules`, where a registrar can
# read it and where it reaches the model as instruction. A value that violates those rules is
# an instruction-following failure and is measured as one. It is not repaired by a word list
# written from one chart and applied to every chart.
#
# `acr.answer_checks.ANSWER_CHECK_KINDS` is now empty, so re-adding a block here makes this
# file fail to load rather than declare rules that never fire. Field `format` and
# `allowable_values` are still enforced -- they are a contract on shape, they carry no
# oncology, and they are the only check with a positive measured record.

downstream_warning:
  - >
    A clinical and a pathologic stage group are not interchangeable inputs to a concordance
    rule. A guideline recommendation keyed on "stage IIIA" means one of them specifically, and
    silently substituting the other changes which patients are judged non-concordant.

# ------------------------------------------------------------------------------ provenance
# WHY THIS BLOCK EXISTS, and it is a fact about this file rather than about the software.
# All four original specs in this tree were written by a language model in ONE commit --
# e5229b0, 2026-07-25 -- from whatever manual text happened to be in its context, and were
# committed under a human author's name. The stage spec was written by an agent on
# 2026-07-26. NO REGISTRAR OR PHYSICIAN HAS READ A LINE OF ANY OF THEM. Transcribed lines,
# inferred lines and invented lines are all present, mixed, and to a reader they are
# identical: they are all just YAML.
#
# One record per ENFORCED element -- the lines some code path changes behaviour on. Missing
# one makes this file refuse to load. The advisory half for the sentences a human reads
# rather than the runtime lives in `editorial_provenance`, where a missing record is a
# finding printed in the review document instead of an error.
#
# origin: model_authored is not modesty. It is the accurate answer for every element below.
# `store_manual` and `ajcc_manual` require a section, item or rule number IN THE BASIS, and
# nothing here has one, because nothing here is a line a manual states: these are regexes,
# coverage-gate switches, document-type groupings and sample sizes, all invented in this
# repository. The four code tables come closest, and they were recalled by a model, not
# copied out of the manual -- so they say so, and they name the item a human should check
# them against.
provenance:
  - element: "fields[clinical_t].format"
    origin: model_authored
    status: draft
    basis: >-
      no external source; written by an agent on 2026-07-26, in this repository, with no manual
      open. The pattern is a Python regular expression, applied with a full match by
      acr/answer_checks.py. No manual states a pattern; this one was written to fit the
      description beside it, and it constrains the SHAPE of a value only -- it cannot tell a
      real code from a well-formed invented one.
