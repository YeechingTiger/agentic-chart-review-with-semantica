spec_id: STORE.390.date_of_initial_diagnosis
spec_version: 0.1.0
source_authority:
  document: "CoC STORE 2025 (updated 2025-04-24)"
  items: ["Date of Initial Diagnosis [390]"]
data_source: notes

question: "On what date was this tumour first diagnosed by a physician?"

fields:
  - name: date_of_initial_diagnosis
    type: string
    format: "(19|20)\\d{2}(0[1-9]|1[0-2]|99)([0-2]\\d|3[01]|99)"
    nullable: false
    description: "CCYYMMDD; 99 may represent an unknown month or day; blanks are not allowed"
  - name: month_day_imputed
    type: boolean
    allowable_values: [true, false]
    description: "true if month or day came from a seasonal/approximate phrase rather than an explicit date"

decision_rule:
  - "Use the FIRST date of diagnosis, whether clinically or histologically established."
  - "If a physician states that in retrospect the patient had cancer at an earlier date, use the earlier date."
  - "If first-course treatment began before a diagnosis was documented, use the treatment start date."
  - "For a case diagnosed at autopsy or by death certificate only, the date of death is the date of diagnosis."
  - "If the year cannot be identified it must be approximated, and month and day are then unknown."

evidence_rules:
  counts_as_evidence:
    - "A pathology or cytology report whose interpretation establishes the diagnosis."
    - "A physician's clinical impression of cancer, which can establish a clinical diagnosis without tissue."
  does_not_count:
    - "Cytology carrying only an ambiguous term, UNLESS a positive biopsy or a physician's clinical impression of cancer supports it."
    - "A radiology report that merely describes a suspicious mass, absent a physician's diagnostic statement."

conflict_rules:
  - if: "cytology with an ambiguous term precedes a confirmatory biopsy AND a physician's clinical impression of cancer exists at the cytology date"
    then: "use the cytology date"
  - if: "cytology with an ambiguous term precedes a confirmatory biopsy AND no clinical impression supports it"
    then: "use the biopsy date"
  # Both strata establish this field, so the pair they form has to be arbitrated by name — a
  # rule that names neither cannot be applied to it. The direction follows decision_rule 1:
  # first date, clinically OR histologically established. Later tissue does not supersede an
  # earlier clinical diagnosis; it confirms one.
  - if: "a tissue or cytology interpretation and a physician's diagnostic statement about the target tumour give different dates"
    then: "use the earlier date, whichever document type it came from, and cite both — tissue confirmation does not reset a diagnosis that a physician had already made"
  - if: "documents disagree on the date"
    then: "take the earliest that satisfies the decision rules and cite every conflicting source"

proof_obligation:
  for_positive: >-
    At least one qualifying witness establishing the diagnosis, with its date — and,
    where sources conflict in a way that could change the answer, every one of them
    cited and the conflict resolved under the rules below. "One document" alone
    contradicted the conflict rule that demands citing every conflicting source.
  # Asserting "no diagnosis date exists anywhere in this chart" is a coverage claim, but the
  # documents that could carry the earliest date are type-identifiable, so this stays a
  # type-stratified exclusion (P3d, witness-style strata) rather than a time-partitioned one.
  for_negative:
    mode: stratified_exclusion
    confidence: 0.95
    # No gate here. How hard a run must look before it may say it found nothing is a
    # question about coverage, not about what the answer means, and it belongs to the
    # coverage/audit module. Until 2026-08-02 this block asserted
    # `required_keywords_all_searched` over a list this file no longer declares — a switch
    # that reads as enforcement and enforces nothing, which speclint F4 refuses by name.
    statement: >
      Do not guess a date. If the available documents do not establish one, say so with the
      status that fits: no qualifying witness found, or the corpus itself insufficient.

abstention:
  EVIDENCE_INSUFFICIENT: "No document in the chart establishes a diagnosis date."
  SPEC_INSUFFICIENT: "The chart shows multiple primaries and it is unclear which tumour is being reported."

date_imputation:
  spring: "04"
  summer_or_midyear: "07"
  fall_or_autumn: "10"
  winter: "12 or 01 — decide whether the phrasing means late or early in the year"
  rule: "Whenever a seasonal phrase is used, set month_day_imputed true and quote the original wording."

boundary_cases:
  - case: "Cytology 2010-06-12 'suspicious for cancer'; pathology positive 2010-07-02; an oncology note of 2010-06-12 records a clinical impression of malignancy"
    answer: "20100612"
  - case: "Pathology 2010-05-17 'suspicious'; confirmed positive 2010-05-22"
    answer: "20100517"
  - case: "Referral note dated 2010-07-05 says the patient was diagnosed in the spring of 2010"
    answer: "20100499"
    month_day_imputed: true


