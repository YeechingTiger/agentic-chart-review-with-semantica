spec_id: STORE.390.date_of_initial_diagnosis
spec_version: 0.1.0
source_authority:
  document: "CoC STORE 2025 (updated 2025-04-24)"
  items: ["Date of Initial Diagnosis [390]"]
data_source: notes

question: "On what date was this tumour first diagnosed by a physician?"

fields:
  - name: date_of_initial_diagnosis
    type: string
    # TWO STEPS, because a regex is a shape and a date is arithmetic. `format` asks whether
    # each component is a legal token; `calendar` asks whether the three together name a day
    # that exists. Until 2026-08-02 there was only the pattern, and it accepted 29 February
    # 2018, 31 April and day `00` while the provenance record described it as rejecting
    # non-date text — true, and a different claim.
    format: "(19|20)\\d{2}(0[1-9]|1[0-2]|99)(0[1-9]|[12]\\d|3[01]|99)"
    calendar: partial_date_ccyymmdd
    nullable: false
    description: >-
      CCYYMMDD. 99 in the MONTH or DAY slot means that component is not recorded:
      YYYYMMDD known, YYYYMM99 day unknown, YYYY9999 month and day unknown. YYYY99DD — a
      known day under an unknown month — is not a declared notation and is refused. The YEAR
      slot is never 99: a year that cannot be identified is APPROXIMATED to a real year and
      `year_imputed` records that it was. Blanks are not allowed.
  # THREE FLAGS, NOT ONE. `month_day_imputed` answered three questions with one boolean and
  # so could not distinguish "the month came from 'the spring'" from "the day is simply not
  # recorded" from "the year itself is an estimate". Those have different remedies, and the
  # third had no representation at all — which is why two runs in the E4 floor batch submitted
  # `20999999`, extending the 99-means-unknown convention into the year slot because that was
  # the only way the value space let them say the year was not known.
  #
  # There is deliberately no `uncertainty_reason` field. `date_imputation.rule` already
  # requires the original wording to be quoted, and a quote belongs in the evidence ledger
  # with its offsets, not in a second free-text slot that nothing can check against the chart.
  - name: year_imputed
    type: boolean
    allowable_values: [true, false]
    description: "true if the year is an approximation rather than a year the record states"
  - name: month_imputed
    type: boolean
    allowable_values: [true, false]
    description: "true if the month came from a seasonal or approximate phrase rather than an explicit date"
  - name: day_imputed
    type: boolean
    allowable_values: [true, false]
    description: "true if the day came from an approximate phrase rather than an explicit date"

decision_rule:
  - "Use the FIRST date of diagnosis, whether clinically or histologically established."
  - "If a physician states that in retrospect the patient had cancer at an earlier date, use the earlier date."
  - "If first-course treatment began before a diagnosis was documented, use the treatment start date."
  - "For a case diagnosed at autopsy or by death certificate only, the date of death is the date of diagnosis."
  - "If the year cannot be identified it must be approximated, and month and day are then unknown."

evidence_rules:
  counts_as_evidence:
    - "A pathology or cytology report whose interpretation establishes the diagnosis."
    - "A physician's clinical impression of cancer, which can establish a clinical diagnosis without tissue."
  does_not_count:
    - "Cytology carrying only an ambiguous term, UNLESS a positive biopsy or a physician's clinical impression of cancer supports it."
    - "A radiology report that merely describes a suspicious mass, absent a physician's diagnostic statement."

conflict_rules:
  - if: "cytology with an ambiguous term precedes a confirmatory biopsy AND a physician's clinical impression of cancer exists at the cytology date"
    then: "use the cytology date"
  - if: "cytology with an ambiguous term precedes a confirmatory biopsy AND no clinical impression supports it"
    then: "use the biopsy date"
  # Both strata establish this field, so the pair they form has to be arbitrated by name — a
  # rule that names neither cannot be applied to it. The direction follows decision_rule 1:
  # first date, clinically OR histologically established. Later tissue does not supersede an
  # earlier clinical diagnosis; it confirms one.
  - if: "a tissue or cytology interpretation and a physician's diagnostic statement about the target tumour give different dates"
    then: "use the earlier date, whichever document type it came from, and cite both — tissue confirmation does not reset a diagnosis that a physician had already made"
  - if: "documents disagree on the date"
    then: "take the earliest that satisfies the decision rules and cite every conflicting source"

proof_obligation:
  for_positive: >-
    At least one qualifying witness establishing the diagnosis, with its date — and,
    where sources conflict in a way that could change the answer, every one of them
    cited and the conflict resolved under the rules below. "One document" alone
    contradicted the conflict rule that demands citing every conflicting source.
  # Asserting "no diagnosis date exists anywhere in this chart" is a coverage claim, but the
  # documents that could carry the earliest date are type-identifiable, so this stays a
  # type-stratified exclusion (P3d, witness-style strata) rather than a time-partitioned one.
  for_negative:
    mode: stratified_exclusion
    confidence: 0.95
    # No gate here. How hard a run must look before it may say it found nothing is a
    # question about coverage, not about what the answer means, and it belongs to the
    # coverage/audit module. Until 2026-08-02 this block asserted
    # `required_keywords_all_searched` over a list this file no longer declares — a switch
    # that reads as enforcement and enforces nothing, which speclint F4 refuses by name.
    statement: >
      Do not guess a date. If the available documents do not establish one, say so with the
      status that fits: no qualifying witness found, or the corpus itself insufficient.

# ------------------------------------------------------------------------------ outcomes
# THE OUTCOME SPACE, declared here because it is a property of the question rather than of
# the tool that submits into it. Until 2026-08-02 the list lived as a literal `enum` in
# `toolbox.TOOL_SCHEMAS` and as a chain of `status == "..."` branches in `answer_gate`, and
# two things followed. This file's own proof obligation told the model to abstain "with the
# status that fits: no qualifying witness found, or the corpus itself insufficient" — a
# second abstention the tool would not offer and no branch recognised, so the instruction
# could not be complied with. And a status nobody declared matched no branch, fell through to
# the gate's unconditional acceptance, and stood having discharged nothing.
#
# `kind` is the part code reads. Obligations attach to what a status CLAIMS, not to how it is
# spelled: EVIDENCE_INSUFFICIENT and CORPUS_INSUFFICIENT are both claims about this chart, so
# both are only true if the chart was searched, and both go to the coverage machinery.
result:
  status:
    FOUND:
      kind: value
      meaning: "a date is being returned, and the document establishing it is in the evidence ledger"
    EVIDENCE_INSUFFICIENT:
      kind: abstain_evidence
      meaning: >-
        the chart was searched and no document in it establishes a diagnosis date — the
        documents that could carry one are here, and none of them does
    CORPUS_INSUFFICIENT:
      kind: abstain_evidence
      meaning: >-
        the documents that would carry the date are not in this corpus at all — the record
        begins after the diagnosis, or the diagnosing encounter happened elsewhere. This is a
        different report from EVIDENCE_INSUFFICIENT and has a different remedy: go and get
        more record, rather than adjudicate the record you have
    SPEC_INSUFFICIENT:
      kind: abstain_spec
      meaning: "this specification does not cover the case in front of you"
    TECHNICAL_FAILURE:
      kind: failure
      submittable: false
      meaning: >-
        the run did not reach an answer — budget, tooling or transport. An outcome of a run
        and never an answer, so it is declared here and kept OUT of the tool's enum: handing
        a model a give-up button measures the button

abstention:
  EVIDENCE_INSUFFICIENT: "No document in the chart establishes a diagnosis date."
  CORPUS_INSUFFICIENT: "The chart contains no document from the period in which the diagnosis was made."
  SPEC_INSUFFICIENT: "The chart shows multiple primaries and it is unclear which tumour is being reported."

date_imputation:
  spring: "04"
  summer_or_midyear: "07"
  fall_or_autumn: "10"
  winter: "12 or 01 — decide whether the phrasing means late or early in the year"
  rule: >-
    Whenever a seasonal phrase is used, set the flag for each component you imputed —
    month_imputed, day_imputed, and year_imputed if the year itself is an estimate — and
    quote the original wording as evidence.

boundary_cases:
  - case: "Cytology 2010-06-12 'suspicious for cancer'; pathology positive 2010-07-02; an oncology note of 2010-06-12 records a clinical impression of malignancy"
    answer: "20100612"
  - case: "Pathology 2010-05-17 'suspicious'; confirmed positive 2010-05-22"
    answer: "20100517"
  - case: "Referral note dated 2010-07-05 says the patient was diagnosed in the spring of 2010"
    answer: "20100499"
    month_imputed: true
    day_imputed: true
    year_imputed: false


# ------------------------------------------------------------------------------ provenance
# WHY THIS BLOCK EXISTS, and it is a fact about this file rather than about the software.
# All four original specs in this tree were written by a language model in ONE commit --
# e5229b0, 2026-07-25 -- from whatever manual text happened to be in its context, and were
# committed under a human author's name. The stage spec was written by an agent on
# 2026-07-26. NO REGISTRAR OR PHYSICIAN HAS READ A LINE OF ANY OF THEM. Transcribed lines,
# inferred lines and invented lines are all present, mixed, and to a reader they are
# identical: they are all just YAML.
#
# One record per ENFORCED element -- the lines some code path changes behaviour on. Missing
# one makes this file refuse to load. The advisory half for the sentences a human reads
# rather than the runtime lives in `editorial_provenance`, where a missing record is a
# finding printed in the review document instead of an error.
#
# origin: model_authored is not modesty. It is the accurate answer for every element below.
# `store_manual` and `ajcc_manual` require a section, item or rule number IN THE BASIS, and
# nothing here has one, because nothing here is a line a manual states: these are regexes,
# coverage-gate switches, document-type groupings and sample sizes, all invented in this
# repository. The four code tables come closest, and they were recalled by a model, not
# copied out of the manual -- so they say so, and they name the item a human should check
# them against.
provenance:
  - element: "fields[date_of_initial_diagnosis].format"
    origin: model_authored
    status: draft
    basis: >-
      no external source; mechanically replaced the literal registry notation written by a
      language model in commit e5229b0 (2026-07-25) with a Python full-match pattern, and
      narrowed on 2026-08-02 from ([0-2]\d|3[01]|99) to (0[1-9]|[12]\d|3[01]|99) because the
      first admitted day 00. This is now the COMPONENT half only — whether the components
      name a day that exists is the `calendar` element below. Two things about it are still
      unchecked and neither is fixed here: the year bound (19|20)\d{2} has no source and
      admits 2099, a year no diagnosis in any real extract can have, and nothing at this layer
      knows the extract date that would settle it; and the unknown-component rules have never
      been compared against STORE item [390].
  - element: "fields[date_of_initial_diagnosis].calendar"
    origin: model_authored
    status: draft
    basis: >-
      no external source; added 2026-08-02. It exists because the pattern above cannot decide
      what it was being described as deciding: leap years are arithmetic, and the pattern
      accepted 20180229, 20180431 and 20180100. The kind name refers to
      `answer_checks.CALENDAR_KINDS['partial_date_ccyymmdd']`, whose rules — where 99 is
      legal, and that YYYY99DD is refused as UNDECLARED rather than as impossible — were
      chosen in this repository and have not been checked against STORE item [390].
  - element: "fields[year_imputed].allowable_values"
    origin: model_authored
    status: draft
    basis: >-
      no external source; added 2026-08-02 together with month_imputed and day_imputed, which
      replace the single month_day_imputed boolean. The reason is measured rather than
      stylistic: in the E4 floor batch two runs submitted 20999999, putting 99 in the YEAR
      slot, because decision_rule[5] orders an unidentifiable year approximated and no field
      could record that it had been. Whether a registry expects an approximated year to be
      flagged at all, and whether three flags are the representation STORE item [390] wants,
      has not been reviewed by a registrar.
  - element: "fields[month_imputed].allowable_values"
    origin: model_authored
    status: draft
    basis: >-
      no external source; the surviving half of the month_day_imputed boolean written by a
      language model in commit e5229b0 (2026-07-25), split on 2026-08-02 so that an imputed
      month and an unrecorded day stop sharing one flag. Not reviewed by a registrar.
  - element: "fields[day_imputed].allowable_values"
    origin: model_authored
    status: draft
    basis: >-
      no external source; the other half of the month_day_imputed split described above.
      Not reviewed by a registrar.
  - element: "result.status"
    origin: model_authored
    status: draft
    basis: >-
      no external source; the outcome space was moved out of `toolbox.TOOL_SCHEMAS` into this
      file on 2026-08-02. FOUND / EVIDENCE_INSUFFICIENT / SPEC_INSUFFICIENT are the three this
      repository has always used, invented here rather than taken from any manual.
      CORPUS_INSUFFICIENT is new and is the status this file's own proof obligation had
      already been instructing the model to use for a week while nothing implemented it.
      TECHNICAL_FAILURE names an outcome the runtime produces and no model may claim. Whether
      a registry distinguishes "the record does not say" from "the record does not go back far
      enough", and what it wants reported for each, has not been reviewed by a registrar.
